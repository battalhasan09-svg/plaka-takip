<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>NOVA GARDEN SİTESİ PLAKA BİLGİ SİSTEMİ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    :root {
      --primary: #0f172a;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --success: #16a34a;
      --success-hover: #15803d;
      --danger: #dc2626;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
    }

    * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 50px; }

    /* Üst Başlık */
    header {
      background: var(--primary);
      color: #fff;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 1.05rem; font-weight: 700; }
    .header-right { display: flex; align-items: center; gap: 8px; }
    #connectionStatus { font-size: 0.75rem; padding: 4px 8px; border-radius: 99px; background: #334155; color: #cbd5e1; }
    .btn-logout { background: transparent; border: none; color: #cbd5e1; cursor: pointer; font-size: 1rem; padding: 4px; }

    .main { max-width: 500px; margin: 0 auto; padding: 12px; }

    /* PIN Giriş Modalı */
    #pinOverlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(4px);
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .pin-card {
      background: #fff;
      width: 100%;
      max-width: 340px;
      padding: 28px 24px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .pin-card h2 { font-size: 1.2rem; margin-bottom: 8px; color: var(--primary); }
    .pin-card p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 18px; }
    .pin-input {
      width: 100%;
      padding: 14px;
      font-size: 1.3rem;
      text-align: center;
      letter-spacing: 0.3em;
      border: 2px solid var(--border);
      border-radius: 8px;
      margin-bottom: 14px;
      font-family: monospace;
    }
    .pin-input:focus { border-color: var(--accent); outline: none; }

    /* Canlı Kamera Alanı */
    .viewport-card {
      position: relative;
      width: 100%;
      height: 240px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 14px;
      border: 1px solid var(--border);
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    
    .plate-target {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 75%;
      height: 60px;
      border: 2px solid #22c55e;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
      border-radius: 6px;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .plate-target::after {
      content: "PLAKAYI BU ALANA TUTUN";
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      background: rgba(0,0,0,0.6);
      padding: 2px 6px;
      border-radius: 4px;
      position: absolute;
      bottom: -22px;
    }

    .cam-overlay-status {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
      font-weight: 600;
      pointer-events: none;
    }

    .scanner-controls { display: flex; gap: 8px; margin-bottom: 14px; }
    .btn {
      flex: 1;
      padding: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease;
    }
    .btn-cam-toggle { background: var(--accent); color: #fff; }
    .btn-pause { background: #475569; color: #fff; }
    .btn-new-entry { 
      background: var(--primary); 
      color: #fff; 
      padding: 0 14px; 
      border-radius: 6px; 
      white-space: nowrap; 
      font-size: 0.85rem;
      flex: none;
    }
    .btn-new-entry:hover { background: #1e293b; }

    /* Arama Butonu */
    .btn-call {
      background-color: var(--success);
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: none;
      white-space: nowrap;
    }
    .btn-call:hover { background-color: var(--success-hover); }
    .btn-call.disabled { background-color: #cbd5e1; pointer-events: none; color: #94a3b8; }

    /* Arama Kartı */
    .search-card {
      background: var(--card);
      border-radius: 10px;
      padding: 12px;
      border: 1px solid var(--border);
      margin-bottom: 14px;
    }
    .search-row { display: flex; gap: 8px; }
    .search-input {
      flex: 1;
      padding: 12px;
      font-size: 0.95rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase;
      font-weight: 700;
    }
    .search-input:focus { border-color: var(--accent); outline: none; }

    .results { max-height: 280px; overflow-y: auto; margin-top: 10px; }
    .result-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 8px;
      border-bottom: 1px solid var(--border);
    }
    .result-plate {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
      font-weight: 700;
      background: #e2e8f0;
      padding: 4px 8px;
      border-radius: 4px;
      border-left: 3px solid #facc15;
    }
    .result-meta { text-align: right; }
    .result-name { font-weight: 600; font-size: 0.9rem; }
    .result-loc { font-size: 0.75rem; color: var(--text-muted); }

    /* Düzenleme Kartı */
    .edit-modal {
      display: none;
      background: var(--card);
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-top: 14px;
    }
    .edit-modal h3 { font-size: 1rem; margin-bottom: 12px; }
    .field { margin-bottom: 10px; }
    .field label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; }
    .field input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); font-size: 0.95rem; }
    .actions { display: flex; gap: 8px; margin-top: 14px; }
    .btn-save { background: var(--success); color: #fff; }
    .btn-save:hover { background: var(--success-hover); }
    .btn-close { background: #e2e8f0; color: #334155; }

    /* Bildirim Toast */
    #toastNotification {
      position: fixed;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #0f172a;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
      z-index: 9999999;
      transition: top 0.3s ease-in-out;
    }
    #toastNotification.show { top: 20px; }
    #toastNotification.toast-success { background-color: var(--success); }
    #toastNotification.toast-error { background-color: var(--danger); }
  </style>
</head>
<body>

  <!-- PIN KODU DOĞRULAMA EKRANI -->
  <div id="pinOverlay" style="display:none;">
    <div class="pin-card">
      <h2>Yetkili Girişi</h2>
      <p>Lütfen devam etmek için site yönetim PIN kodunu girin.</p>
      <input type="password" id="pinInput" class="pin-input" placeholder="••••" maxlength="8" inputmode="numeric">
      <button class="btn btn-cam-toggle" onclick="submitPin()">Giriş Yap</button>
    </div>
  </div>

  <!-- Bildirim Alanı -->
  <div id="toastNotification">
    <span id="toastText">Bilgiler güncellendi</span>
  </div>

  <header>
    <h1>NOVA GARDEN SİTESİ PLAKA BİLGİ SİSTEMİ</h1>
    <div class="header-right">
      <div id="connectionStatus">Bağlanıyor...</div>
      <button class="btn-logout" title="Çıkış Yap / PIN Sıfırla" onclick="logoutPin()">🔒</button>
    </div>
  </header>

  <div class="main">
    
    <!-- Canlı Kamera Vizörü -->
    <div class="viewport-card">
      <video id="webcam" playsinline autoplay muted></video>
      <div class="plate-target"></div>
      <div class="cam-overlay-status">
        <span id="fpsCounter">Canlı Tarama</span>
        <span id="detectedRaw">Metin bekleniyor...</span>
      </div>
      <canvas id="cropCanvas" style="display:none;"></canvas>
    </div>

    <!-- Kamera Butonları -->
    <div class="scanner-controls">
      <button class="btn btn-cam-toggle" id="btnStart" onclick="startScanner()">📷 Kamerayı Başlat</button>
      <button class="btn btn-pause" id="btnPause" onclick="togglePause()" style="display:none;">⏸ Duraklat</button>
    </div>

    <!-- Arama ve Yeni Kayıt -->
    <div class="search-card">
      <div class="search-row">
        <input type="text" id="searchInput" class="search-input" placeholder="PLAKA / SAKİN / DAİRE ARA..." oninput="handleSearch()">
        <button class="btn btn-new-entry" onclick="openNewEntry()">+ Yeni Giriş</button>
      </div>
      <div class="results" id="resultsList"></div>
    </div>

    <!-- Bilgi Düzenleme / Ekleme Kartı -->
    <div class="edit-modal" id="editModal">
      <h3 id="modalTitle">Sakin & Araç Kaydı Düzenle</h3>
      <input type="hidden" id="editRow">
      <div style="display:flex; gap:8px;">
        <div class="field" style="flex:1;">
          <label>Blok</label>
          <input type="text" id="editBlok" placeholder="Örn: A">
        </div>
        <div class="field" style="flex:1;">
          <label>Daire</label>
          <input type="text" id="editDaire" placeholder="Örn: 12">
        </div>
      </div>
      <div class="field">
        <label>Sakin Adı Soyadı</label>
        <input type="text" id="editAdSoyad" placeholder="Ad Soyad">
      </div>
      <div class="field">
        <label>Telefon</label>
        <div style="display:flex; gap:8px;">
          <input type="text" id="editTelefon" placeholder="05XXXXXXXXX" oninput="updateCallButton(this.value)">
          <a href="#" id="btnCallResident" class="btn-call disabled" target="_blank">
            📞 Ara
          </a>
        </div>
      </div>
      <div class="field">
        <label>Araç Plakası</label>
        <input type="text" id="editPlaka" placeholder="34ABC123" style="font-family:'JetBrains Mono',monospace; font-weight:700;">
      </div>
      <div class="actions">
        <button class="btn btn-save" id="btnSave" onclick="saveData()">Kaydet</button>
        <button class="btn btn-close" onclick="closeEdit()">Kapat</button>
      </div>
    </div>

  </div>

  <script>
    // -------------------------------------------------------------
    // BURAYA APPS SCRIPT WEB APP URL'NİZİ YAPIŞTIRIN (/exec ile biten)
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzhepimbIndy0vO4TelDeeYRiV4ODeNWGzFQ8tmTBefigNXWi3v_U_Jfb9K4Bt2KwaP/exec";
    // -------------------------------------------------------------

    let currentPin = localStorage.getItem('site_guard_pin') || '';
    let db = [];
    let videoStream = null;
    let isProcessing = false;
    let isPaused = false;
    let scanInterval = null;
    let tesseractWorker = null;

    const PLATE_REGEX = /^(0[1-9]|[1-7][0-9]|8[01])([A-Z]{1,3})(\d{2,4})$/;

    function showToast(message, type = 'success') {
      const toast = document.getElementById('toastNotification');
      const text = document.getElementById('toastText');
      text.innerText = message;
      
      toast.className = '';
      toast.classList.add(type === 'success' ? 'toast-success' : 'toast-error', 'show');

      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    // PIN Yönetimi
    function checkAuth() {
      if (!currentPin) {
        document.getElementById('pinOverlay').style.display = 'flex';
        document.getElementById('pinInput').focus();
      } else {
        document.getElementById('pinOverlay').style.display = 'none';
        fetchData();
      }
    }

    function submitPin() {
      const pin = document.getElementById('pinInput').value.trim();
      if (!pin) return;
      currentPin = pin;
      localStorage.setItem('site_guard_pin', pin);
      document.getElementById('pinOverlay').style.display = 'none';
      fetchData();
    }

    function logoutPin() {
      if (confirm("PIN sıfırlansın ve çıkış yapılsın mı?")) {
        localStorage.removeItem('site_guard_pin');
        currentPin = '';
        location.reload();
      }
    }

    window.onload = async function() {
      checkAuth();
      try {
        tesseractWorker = await Tesseract.createWorker('eng');
        await tesseractWorker.setParameters({
          tessedit_char_whitelist: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ',
          tessedit_pageseg_mode: Tesseract.PSM.SINGLE_LINE
        });
      } catch (e) {
        console.error("Worker hatası:", e);
      }
    };

    // Google Tablosundan PIN ile Veri Çekme
    async function fetchData() {
      const status = document.getElementById('connectionStatus');
      status.innerText = "Yükleniyor...";
      try {
        const res = await fetch(`${APPS_SCRIPT_URL}?pin=${encodeURIComponent(currentPin)}`);
        const result = await res.json();
        
        if (result.error) {
          showToast("Hatalı PIN! Erişim reddedildi.", "error");
          status.innerText = "Yetkisiz";
          status.style.background = "#dc2626";
          logoutPin();
          return;
        }

        db = result;
        status.innerText = db.length + " Araç Kayıtlı";
        status.style.background = "#16a34a";
      } catch (err) {
        status.innerText = "Bağlantı Hatası";
        status.style.background = "#dc2626";
      }
    }

    async function startScanner() {
      const video = document.getElementById('webcam');
      const btnStart = document.getElementById('btnStart');
      const btnPause = document.getElementById('btnPause');

      try {
        videoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } },
          audio: false
        });
        video.srcObject = videoStream;
        await video.play();

        btnStart.style.display = 'none';
        btnPause.style.display = 'flex';

        scanInterval = setInterval(processFrame, 350);
      } catch (err) {
        showToast("Kamera açılamadı: " + err.message, "error");
      }
    }

    function togglePause() {
      isPaused = !isPaused;
      document.getElementById('btnPause').innerText = isPaused ? "▶ Devam Et" : "⏸ Duraklat";
    }

    async function processFrame() {
      if (isProcessing || isPaused || !videoStream || !tesseractWorker) return;

      const video = document.getElementById('webcam');
      if (video.videoWidth === 0) return;

      isProcessing = true;
      const canvas = document.getElementById('cropCanvas');
      const ctx = canvas.getContext('2d');

      const cropW = video.videoWidth * 0.75;
      const cropH = video.videoHeight * 0.25;
      const cropX = (video.videoWidth - cropW) / 2;
      const cropY = (video.videoHeight - cropH) / 2;

      canvas.width = cropW;
      canvas.height = cropH;

      ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
      
      try {
        const { data: { text } } = await tesseractWorker.recognize(canvas);
        let raw = text.replace(/[^A-Z0-9]/g, '').trim();

        if (raw.startsWith("TR") && raw.length > 7) {
          raw = raw.substring(2);
        }

        if (raw) {
          document.getElementById('detectedRaw').innerText = raw;
        }

        if (PLATE_REGEX.test(raw)) {
          if (navigator.vibrate) navigator.vibrate(150);
          isPaused = true;
          document.getElementById('btnPause').innerText = "▶ Devam Et";

          document.getElementById('searchInput').value = raw;
          handleSearch();

          const matched = db.find(i => i.plaka === raw);
          if (matched) {
            openEdit(matched);
          } else {
            openNewEntry(raw);
          }
        }
      } catch (err) {
        console.warn("OCR hatası:", err);
      } finally {
        isProcessing = false;
      }
    }

    function handleSearch() {
      const q = document.getElementById('searchInput').value.trim().toUpperCase();
      const list = document.getElementById('resultsList');
      list.innerHTML = '';
      if (!q) return;

      const filtered = db.filter(i => 
        i.plaka.includes(q) || 
        i.adSoyad.toUpperCase().includes(q) || 
        i.blok.toUpperCase().includes(q) || 
        i.daire.toString().includes(q)
      );

      if (filtered.length === 0) {
        list.innerHTML = `<div style="text-align:center; padding:12px; font-size:0.85rem; color:#64748b;">Kayıt bulunamadı.</div>`;
        return;
      }

      filtered.forEach(item => {
        const cleanPhone = String(item.telefon || '').replace(/[^0-9+]/g, '');
        const hasPhone = cleanPhone.length >= 7;

        const div = document.createElement('div');
        div.className = 'result-item';
        div.innerHTML = `
          <div onclick="openEditByRow(${item.rowIndex})" style="flex:1; cursor:pointer;">
            <span class="result-plate">${item.plaka}</span>
            <div class="result-loc">${item.blok} Blok - No: ${item.daire}</div>
          </div>
          <div style="display:flex; align-items:center; gap:10px;">
            <div class="result-meta" onclick="openEditByRow(${item.rowIndex})" style="cursor:pointer;">
              <div class="result-name">${item.adSoyad}</div>
              <div class="result-loc">${item.telefon || 'Tel Yok'}</div>
            </div>
            ${hasPhone ? `<a href="tel:${cleanPhone}" class="btn-call" style="padding:6px 10px;" onclick="event.stopPropagation();">📞</a>` : ''}
          </div>
        `;
        list.appendChild(div);
      });
    }

    function openEditByRow(rowIndex) {
      const item = db.find(i => i.rowIndex == rowIndex);
      if (item) openEdit(item);
    }

    function updateCallButton(phone) {
      const callBtn = document.getElementById('btnCallResident');
      const cleanPhone = String(phone || '').replace(/[^0-9+]/g, '');
      
      if (cleanPhone.length >= 7) {
        callBtn.href = 'tel:' + cleanPhone;
        callBtn.classList.remove('disabled');
      } else {
        callBtn.href = '#';
        callBtn.classList.add('disabled');
      }
    }

    function openEdit(item) {
      document.getElementById('modalTitle').innerText = "Sakin & Araç Kaydı Düzenle";
      document.getElementById('editRow').value = item.rowIndex;
      document.getElementById('editBlok').value = item.blok;
      document.getElementById('editDaire').value = item.daire;
      document.getElementById('editAdSoyad').value = item.adSoyad;
      document.getElementById('editTelefon').value = item.telefon;
      document.getElementById('editPlaka').value = item.plaka;

      updateCallButton(item.telefon);

      const modal = document.getElementById('editModal');
      modal.style.display = 'block';
      modal.scrollIntoView({ behavior: 'smooth' });
    }

    function openNewEntry(presetPlate = '') {
      document.getElementById('modalTitle').innerText = "Yeni Sakin / Araç Kaydı";
      document.getElementById('editRow').value = '';
      document.getElementById('editBlok').value = '';
      document.getElementById('editDaire').value = '';
      document.getElementById('editAdSoyad').value = '';
      document.getElementById('editTelefon').value = '';
      document.getElementById('editPlaka').value = presetPlate || document.getElementById('searchInput').value.trim().toUpperCase();

      updateCallButton('');

      const modal = document.getElementById('editModal');
      modal.style.display = 'block';
      modal.scrollIntoView({ behavior: 'smooth' });
    }

    function closeEdit() {
      document.getElementById('editModal').style.display = 'none';
    }

    async function saveData() {
      const btn = document.getElementById('btnSave');
      const rowIndex = document.getElementById('editRow').value;
      const isNew = !rowIndex;

      btn.disabled = true;
      btn.innerText = "Kaydediliyor...";

      const payload = {
        pin: currentPin, // Güvenlik PIN'i gönderiliyor
        rowIndex: rowIndex,
        blok: document.getElementById('editBlok').value,
        daire: document.getElementById('editDaire').value,
        adSoyad: document.getElementById('editAdSoyad').value,
        telefon: document.getElementById('editTelefon').value,
        plaka: document.getElementById('editPlaka').value.replace(/\s+/g, '').toUpperCase()
      };

      try {
        await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (isNew) {
          showToast("Yeni kayıt eklendi", "success");
          fetchData();
        } else {
          const idx = db.findIndex(i => i.rowIndex == payload.rowIndex);
          if (idx !== -1) db[idx] = payload;
          showToast("Bilgiler güncellendi", "success");
        }
        
        handleSearch();
        closeEdit();
      } catch (err) {
        showToast("Kayıt hatası oluştu", "error");
      } finally {
        btn.disabled = false;
        btn.innerText = "Kaydet";
      }
    }
  </script>
</body>
</html>
